name: Install Script Publish to Object Storage

on:
  workflow_dispatch:

jobs:
  publish-install-script:
    runs-on: ubuntu-latest

    env:
      BUCKET: mgc-cli
      OBJECT_KEY: install.sh
      SCRIPT_PATH: scripts/install.sh
      MGC_REGION: br-se1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          fetch-depth: 1

      - name: Install MGC CLI
        # Usa o proprio script que sera publicado: se ele estiver quebrado,
        # o workflow falha aqui e nada e enviado para o bucket.
        run: |
          sudo sh "$SCRIPT_PATH" --system
          mgc --version

      - name: Configure Object Storage credentials
        env:
          KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          mgc object-storage api-key add \
            --key-id "$KEY_ID" \
            --key-secret "$KEY_SECRET"

      - name: Upload install.sh
        run: |
          mgc object-storage objects upload \
            --src "$SCRIPT_PATH" \
            --dst "$BUCKET/$OBJECT_KEY" \
            --region "$MGC_REGION" \
            --no-confirm

      - name: Set public-read ACL
        run: |
          mgc object-storage objects acl set \
            --dst "$BUCKET/$OBJECT_KEY" \
            --region "$MGC_REGION" \
            --public-read \
            --no-confirm

      - name: Verify published file
        run: |
          url="https://${BUCKET}.${MGC_REGION}.magaluobjects.com/${OBJECT_KEY}"
          echo "Baixando $url"
          curl --fail --location --silent --show-error -o /tmp/published-install.sh "$url"
          diff "$SCRIPT_PATH" /tmp/published-install.sh
          echo "OK: $url esta identico a $SCRIPT_PATH"
